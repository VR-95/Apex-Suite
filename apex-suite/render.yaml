
services:
  - type: web
    name: apex-suite
    runtime: docker
    plan: free
    dockerfilePath: ./apex-suite/Dockerfile
    dockerContext: ./apex-suite
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY_1
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: DEV_DASHBOARD_PASSWORD
        sync: false
